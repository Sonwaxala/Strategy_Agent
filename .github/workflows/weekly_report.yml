name: Strategy Agent Weekly Report

on:
  schedule:
    # Runs every Monday at 05:23 UTC (07:23 AM SAST)
    - cron: '23 5 * * 1'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Claude Code CLI
        run: npm install -g --allow-scripts=@anthropic-ai/claude-code @anthropic-ai/claude-code

      - name: Configure Git for Memory Commit
        run: |
          git config --global user.name "strategy-agent-bot"
          git config --global user.email "bot@github.com"

      - name: Run Strategy Agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python main.py

      - name: Commit Updated Database Memory
        if: always()
        run: |
          git add strategy_agent_memory.db || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update memory store [skip ci]" && git push)
